<article class="food-card"><a class="food-image-wrap" href="{{ url_for('web.menu', category=item.category) }}"><img class="food-image" src="{{ item.image_url }}" alt="{{ item.name }}" loading="lazy"><span class="food-tag">{{ item.category }}</span>{% if item.popular_score >= 95 %}<span class="popular-tag">★ Student favourite</span>{% endif %}{% if not item.available %}<span class="unavailable-overlay">Sold out for now</span>{% endif %}</a><div class="food-card-body"><div class="food-card-title"><h3>{{ item.name }}</h3><span class="food-price">{{ item.price|inr }}</span></div><p>{{ item.description }}</p><div class="food-card-bottom"><span class="availability {% if item.available %}is-available{% else %}is-unavailable{% endif %}"><i></i>{{ 'Available' if item.available else 'Sold out' }}</span>{% if item.available %}<form method="post" action="{{ url_for('web.add_to_cart', food_id=item.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="add-button" type="submit" aria-label="Add {{ item.name }} to cart">+ <span>Add</span></button></form>{% else %}<button class="add-button disabled" type="button" disabled>Sold out</button>{% endif %}</div></div></article>
